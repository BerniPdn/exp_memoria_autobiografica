<!DOCTYPE html>
<html>

<head>
    <title>Experimento Memoria Autobiografica</title>
    <meta charset="UTF-8">
    <script src="https://unpkg.com/jspsych@8.2.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.0.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-fullscreen@2.0.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@2.0.0"></script>
    <link href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css" rel="stylesheet">
    <script src="runtime.js"></script>
    <script src="recorder.js"></script>
</head>

<body>
    <style>
        /* Estilo general de la página */
        body {
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
        }

        /* Contenedores generales */
        .wrapper-experimento {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            max-width: 750px;
            margin: 0 auto;
            padding: 20px;
        }
        .wrapper-experimento.wide {
            max-width: 850px;
        }

        /* Tarjeta Blanca */
        .card-experimento {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border-radius: 16px;
            padding: 45px 40px;
            text-align: center;
        }

        /* Botónees */
        .jspsych-btn, #btn-enviar-custom {
            background-color: #2563eb !important;
            color: #ffffff !important;
            border: none !important;
            padding: 12px 35px !important;
            font-size: 1rem !important;
            font-weight: 600 !important;
            border-radius: 8px !important;
            cursor: pointer !important;
            transition: background-color 0.2s, transform 0.1s !important;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2) !important;
        }
        .jspsych-btn:hover, #btn-enviar-custom:hover {
            background-color: #1d4ed8 !important;
        }
        .jspsych-btn:active, #btn-enviar-custom:active {
            transform: scale(0.98);
        }
        .jspsych-btn:disabled, #btn-enviar-custom:disabled {
            background-color: #64748b !important;
            opacity: 0.5 !important;
            cursor: not-allowed !important;
            box-shadow: none !important;
        }

        /* Animación REC Micrófono */
        @keyframes parpadear {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .rec-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: #dc2626;
            border-radius: 50%;
            margin-right: 8px;
            animation: parpadear 1.5s infinite;
            vertical-align: middle;
        }
        
        /* Selección inteligente mediante CSS puro */
        .o-label { flex: 1; text-align: center; cursor: pointer; padding: 12px 4px; border-radius: 12px; transition: all 0.2s; border: 1px solid transparent; }
        .o-label:hover { background: #f1f5f9; }
        .o-label:has(input:checked) { background: #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-color: #cbd5e1; }
    </style>

    <script>
        const jsPsych = initJsPsych();
        let experimentoTerminado = false;

        //Seguro anti-cierre de pestaña
        window.addEventListener('beforeunload', function (e) {
            if (!experimentoTerminado) e.preventDefault();
        });
        
        if (!run_id) {
            console.warn("ALERTA: No se detectó ningún 'run-id' en la URL. Las llamadas a la API van a fallar.");
            
            // Aviso si no se abre en Data Pruebas (poco probable)
            document.body.innerHTML = `
                <div style="text-align: center; margin-top: 100px; font-family: sans-serif; padding: 20px;">
                    <h2 style="color: #cc0000;">Error de inicialización</h2>
                    <p style="font-size: 1.1rem; color: #333;">El experimento no se inició a través de la plataforma Datapruebas (en este caso mi servidor).</p>
                    <p style="color: #666;">Por favor, vuelve a ingresar desde el panel de paciente de la plataforma.</p>
                </div>
            `;
            throw new Error("Ejecución detenida: Falta run-id en la URL.");

        }
       
        //
        // Helpers
        //

        /**
         * Crea un trial de jsPsych para la tarea de memoria autobiográfica situada.
         * Inicia la grabación, maneja el temporizador visual y guarda metadatos específicos del período.
         * @param {string} nombreArchivo - Nombre base con el que se guardará el audio en el servidor.
         * @param {string} periodo - El período de tiempo solicitado (ej: 'la niñez', 'el último año').
         * @param {number} tiempo - Tiempo máximo en segundos que dura el relato antes de terminarse.
         * @returns {Object} Devuelve el objeto de configuración del trial para el timeline de jsPsych.
         */
         function crearTrialMemoria(nombreArchivo, periodo, tiempoPensar = 12, tiempoHablar = 60) {
    
            // PANTALLA 1: Tiempo para pensar
            const pantalla_pensar = {
                type: jsPsychHtmlButtonResponse,
                stimulus: /*html*/ `
                    <div class="wrapper-experimento">
                        <div class="card-experimento">
                            <span style="text-transform: uppercase; font-size: 0.85rem; font-weight: 700; color: #64748b; display: block; margin-bottom: 10px;">Etapa de Preparación</span>
                            <h2 style="margin: 0 0 25px 0; font-size: 1.8rem; font-weight: 800; color: #1e293b;">Memoria autobiográfica de: <span style="color: #2563eb;">${periodo}</span></h2>
                            
                            <div style="background: #f8fafc; border: 1px solid #cbd5e1; padding: 25px 30px; border-radius: 12px; margin-bottom: 35px; text-align: left;">
                                <p style="margin: 0 0 15px 0; font-weight: 700; color: #1e293b; text-align: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px;">Para tu relato, tené en cuenta que:</p>
                                <ul style="margin: 0; padding-left: 20px; color: #475569; line-height: 1.7;">
                                    <li style="margin-bottom: 8px;">Debe ser un hecho <b>único y puntual</b> (en un día y lugar específicos).</li>
                                    <li style="margin-bottom: 8px;">No debe ser una rutina o algo que se repetía en el tiempo.</li>
                                    <li>Intentá incluir detalles de lo que viste, escuchaste, sentiste o pensaste.</li>
                                </ul>
                            </div>
                            
                            <div style="background: #eff6ff; border: 1px solid #bfdbfe; padding: 18px 20px; border-radius: 12px; max-width: 550px; margin: 0 auto;">
                                <p style="margin: 0; color: #1e40af; font-weight: 600;">Usa este tiempo para organizar tu idea. La grabación comenzará automáticamente.</p>
                            </div>
                        </div>
                    </div>`,
                choices: [],
                trial_duration: tiempoPensar * 1000,
                on_load: () => {
                    if (typeof intervaloTimer !== 'undefined' && intervaloTimer) clearInterval(intervaloTimer);
                }
            };

            // PANTALLA 2: Tiempo para hablar (Versión Estilizada e Integrada)
            const pantalla_relato = {
                type: jsPsychHtmlButtonResponse,
                stimulus: /*html*/ `
                    <div class="wrapper-experimento">
                        <div class="card-experimento">
                            <div style="margin-bottom: 20px;">
                                <span id="timer-display" style="font-size: 1.1rem; font-weight: 700; background: #f1f5f9; padding: 10px 20px; border-radius: 9999px; color: #334155; border: 1px solid #cbd5e1; display: inline-block;">
                                    Tiempo restante: ${tiempoHablar}s
                                </span>
                            </div>
                            
                            <h2 style="margin: 0 0 25px 0; font-size: 1.9rem; font-weight: 800; color: #1e293b;">Grabando</h2>

                            <div style="background: #fef2f2; border: 1px solid #fca5a5; padding: 25px 30px; border-radius: 12px; margin-bottom: 35px;">
                                <p style="margin: 0; font-size: 1.3rem; font-weight: 700; color: #991b1b;"><span class="rec-dot"></span> ¡Micrófono Activo!</p>
                                <p style="margin: 10px 0 0 0; color: #7f1d1d; font-weight: 500;">Contanos tu recuerdo situado en:<br><span style="font-weight: 700; color: #dc2626; font-size: 1.25rem;">${periodo}</span></p>
                            </div>
                            
                            <div>
                                <button type="button" id="btn-enviar-custom">Enviar recuerdo</button>
                            </div>
                        </div>
                    </div>`,
                choices: [],
                on_load: () => { 
                    comenzarGrabacion();
                    iniciarTimerVisual(tiempoHablar, nombreArchivo);
                    
                    const btn = document.getElementById('btn-enviar-custom');
                    if (btn) {
                        btn.addEventListener('click', function(e) {
                            e.preventDefault();
                            this.disabled = true; // El CSS ya lo pone gris y le saca el cursor solo!
                            this.textContent = "Enviando...";
                            frenarYEnviarServidor(nombreArchivo);
                        });
                    }
                }
            }
            // Retorno del mini-timeline del bloque de memoria
            return {
                timeline: [pantalla_pensar, pantalla_relato]
            };
        }

        /**
         * Crea un trial de jsPsych estático para mostrar pantallas de instrucciones o textos informativos.
         * Con diseño unificado de tarjeta de alta consultoría.
         * @param {string} titulo - El título principal
         * @param {string[]} parrafos - Un arreglo de strings, donde cada elemento es un párrafo o instrucción.
         * @param {string} [boton='Entendido, continuar'] - Texto del botón
         * @returns {Object} Devuelve el objeto de configuración del trial para el timeline de jsPsych.
         */
        function crearInstrucciones(titulo, parrafos, boton = 'Entendido, continuar') {
            const items = parrafos.map(p => `
                <li style="position: relative; padding-left: 35px; margin-bottom: 16px; font-size: 1.1rem; color: #475569; line-height: 1.6; text-align: left; list-style: none;">
                    <span style="position: absolute; left: 0; top: 2px; color: #2563eb; font-weight: bold; font-size: 1.2rem;">✓</span>
                    ${p}
                </li>
            `).join('');

            return {
                type: jsPsychHtmlButtonResponse,
                stimulus: /*html*/ `
                    <div class="wrapper-experimento">
                        <div class="card-experimento">
                            <span style="text-transform: uppercase; font-size: 0.85rem; font-weight: 700; color: #64748b; display: block; margin-bottom: 10px;">Información Importante</span>
                            <h2 style="margin: 0 0 30px 0; font-size: 1.9rem; font-weight: 800; color: #1e293b;">${titulo}</h2>
                            <div style="background: #f8fafc; border: 1px solid #cbd5e1; padding: 30px 25px; border-radius: 12px; margin-bottom: 20px;">
                                <ul style="margin: 0; padding: 0;">${items}</ul>
                            </div>
                        </div>
                    </div>`,
                choices: [boton],
            };
        }

        //
        // Trials estaticos
        //
        const bienvenida = {
            type: jsPsychHtmlButtonResponse,
            stimulus: /*html*/ `
                <div class="wrapper-experimento">
                    <div class="card-experimento">
                        <span style="text-transform: uppercase; font-size: 0.85rem; font-weight: 700; color: #64748b; display: block; margin-bottom: 10px;">Inicio del Experimento</span>
                        <h2 style="margin: 0 0 15px 0; font-size: 1.9rem; font-weight: 800; color: #1e293b;">¡Te damos la bienvenida al experimento!</h2>
                        <h3 style="margin: 0 0 30px 0; font-size: 1.2rem; font-weight: 500; color: #475569;">Este experimento consiste de varias subpartes. Para evitar distracciones te pedimos que:</h3>

                        <div style="background: #f8fafc; border: 1px solid #cbd5e1; padding: 30px 25px; border-radius: 12px; margin-bottom: 20px;">
                            <ul style="margin: 0; padding: 0;">
                                <li style="position: relative; padding-left: 35px; margin-bottom: 18px; font-size: 1.1rem; color: #334155; text-align: left; list-style: none;">
                                    <span style="position: absolute; left: 0; top: 2px; color: #2563eb; font-weight: bold; font-size: 1.2rem;">✓</span>
                                    Cierres otras pestañas y aplicaciones que generen notificaciones.
                                </li>
                                <li style="position: relative; padding-left: 35px; margin-bottom: 18px; font-size: 1.1rem; color: #334155; text-align: left; list-style: none;">
                                    <span style="position: absolute; left: 0; top: 2px; color: #2563eb; font-weight: bold; font-size: 1.2rem;">✓</span>
                                    Pongas el teléfono en modo "No molestar" o silencio.
                                </li>
                                <li style="position: relative; padding-left: 35px; font-size: 1.1rem; color: #334155; text-align: left; list-style: none;">
                                    <span style="position: absolute; left: 0; top: 2px; color: #2563eb; font-weight: bold; font-size: 1.2rem;">✓</span>
                                    Minimices distracciones de tu entorno, intentando estar en un lugar tranquilo.
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>`,
            choices: ['Siguiente'],
        };

        const pantalla = {
            type: jsPsychFullscreen,
            fullscreen_mode: true,
            message: '<h3>El experimento ira a pantalla completa cuando presiones el boton que se encuentra abajo</h3>',
            button_label: 'Ir a pantalla completa'
        }

        const calibracion = {
            type: jsPsychHtmlButtonResponse,
            stimulus: /*html*/ `
            <div class="wrapper-experimento">
                <div class="card-experimento">
                    <span style="text-transform: uppercase; font-size: 0.85rem; font-weight: 700; color: #2563eb; display: block; margin-bottom: 10px;">Paso Previo Requerido</span>
                    <h2 style="margin: 0 0 10px 0; font-size: 1.9rem; font-weight: 800; color: #1e293b;">Verificación de Micrófono</h2>
                    <p style="color: #64748b; margin-bottom: 35px;">Asegurémonos de que tu micrófono funcione correctamente antes de empezar.</p>

                    <div style="background: #f8fafc; border: 1px solid #cbd5e1; padding: 25px 30px; border-radius: 12px; margin-bottom: 35px; text-align: left;">
                        <h3 style="margin: 0 0 8px 0; font-size: 1.2rem; color: #1e293b;">🎙️ Verificación de micrófono</h3>
                        <p style="margin-bottom: 15px; font-size: 0.95rem; color: #475569;">Hablá en voz alta frente a tu dispositivo y fijate que la barra se mueva. Si no se mueve, intenta hablar un poco más fuerte.</p>
                        <div style="background: #e2e8f0; border-radius: 9999px; height: 16px; overflow: hidden; border: 1px solid #cbd5e1;">
                            <div id="barra-audio" style="height: 100%; width: 0%; background: #22c55e; transition: width 0.1s;"></div>
                        </div>
                    </div>

                    <p id="estado-mic-cam" style="color: #64748b; font-weight: 600; margin-bottom: 25px;">⏳ Iniciando micrófono...</p>
                    
                    <div>
                        <button id="btn-calibracion" class="jspsych-btn" disabled>
                            Calibración de audio lista
                        </button>
                    </div>
                </div>
            </div>`,
            choices: [],

            on_load: function () {
                const constraints = {
                    audio: true,
                    video: false
                };

                navigator.mediaDevices.getUserMedia(constraints)
                    .then(function (stream) {
                        document.getElementById('estado-mic-cam').textContent = 'Micrófono activo.';
                        document.getElementById('estado-mic-cam').style.color = 'green';
                        document
                            .getElementById('btn-calibracion')
                            .addEventListener('click', function () {
                                jsPsych.finishTrial();
                            });

                        const audioContext = new AudioContext();
                        const source = audioContext.createMediaStreamSource(stream);
                        const analyser = audioContext.createAnalyser();
                        analyser.fftSize = 256;
                        source.connect(analyser);

                        const dataArray = new Uint8Array(analyser.frequencyBinCount);

                        // Calibracion del audio
                        let volumenSuave = 0;
                        function updateBar() {
                            const barra = document.getElementById('barra-audio');
                            if (!barra) return;
                           
                            analyser.getByteTimeDomainData(dataArray);
                        
                            let sumSquaredDifferences = 0;
                            for (let i = 0; i < dataArray.length; i++) {
                                const dev = dataArray[i] - 128;
                                sumSquaredDifferences += dev * dev;
                            }
                            
                            const meanSquare = sumSquaredDifferences / dataArray.length;
                            const rms = Math.sqrt(meanSquare);

                            const porcentajeInstantaneo = Math.max(0, Math.min(rms * 2.8, 100));
                            const factorSuavizado = 0.15;
                            volumenSuave = (volumenSuave * (1 - factorSuavizado)) + (porcentajeInstantaneo * factorSuavizado);

                            barra.style.width = volumenSuave + '%';

                            //Habilitar boton si el promedio se mueve bien con la voz
                            if (volumenSuave > 25) {
                                document.getElementById('btn-calibracion').disabled = false;
                            }

                            requestAnimationFrame(updateBar);
                        }
                        updateBar();
                        inicializarGrabador(stream);
                    })
                    .catch(function () {
                        document.getElementById('estado-mic-cam').textContent = 
                            'No se pudo acceder al micrófono. Revisá los permisos.';
                        document.getElementById('estado-mic-cam').style.color = 'red';
                    });
            }
        }
        
        //
        //Configuracion de las plantillas de instrucciones
        //
        const instrucciones_2 = crearInstrucciones(
            'Instrucciones',
            [
                'Este experimento consiste de varias subpartes. En cada una te pedimos que en 1 minuto nos cuentes una memoria situada en un momento especifico de tu vida',
                'Antes de cada subparte vas a tener un poco de tiempo para pensar',
                'Una vez finalizado este tiempo la grabacion comenzara automaticamente',
                'Si te excedés del tiempo que muestra el contador, el experimento pasará directamente a la siguiente subparte.'
            ]
        );

        //
        // Tareas de memoria autobigrafica
        //
        const autobiografica_1 = crearTrialMemoria('autobiografica_1', 'tu <b>infancia</b> (hasta las 12 años)')
        const autobiografica_2 = crearTrialMemoria('autobiografica_2', 'tu <b>adolescencia</b> (desde los 12 hasta los 20)')
        const autobiografica_3 = crearTrialMemoria('autobiografica_3', 'tu <b>adultez temprana</b> (desde los 20 hasta los 39)')
        const autobiografica_4 = crearTrialMemoria('autobiografica_4', 'tu <b>adultez media</b> (desde los 39 hasta los 65)')
        const autobiografica_5 = crearTrialMemoria('autobiografica_5', 'el <b>año pasado</b>')
        
        // Lógica condicional: Filtro para mayores de 40 años (Adultez Media)
        const pregunta_edad = {
            type: jsPsychHtmlButtonResponse,
            stimulus: '<h2>Antes de continuar:</h2><p style="font-size: 1.2rem;">¿Tenés 40 años o más?</p>',
            choices: ['No, tengo menos de 40', 'Sí, tengo 40 o más'],
            data: { tipo_trial: 'filtro_edad' }
        };

        const nodo_adultez_media = {
            timeline: [autobiografica_4],
            conditional_function: () => {
                const ensayo_edad = jsPsych.data.get().filter({ tipo_trial: 'filtro_edad' }).values()[0];
                return ensayo_edad && ensayo_edad.response === 1;
            }
        };
        

        // Pagina final de cierre y guardado
        const pantalla_final = {
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <h2>¡Muchas gracias por participar!</h2>
                <p>Hemos finalizado todas las tareas del experimento puedes cerrar esta pesataña. </p>
            `,
            choices: [],
            on_load: function() {
                console.log("[Final] Verificando si quedan audios viajando en la fila...");
                
                mostrarPantallaCarga();

                esperarQueTermineLaCola().then(() => {
                    experimentoTerminado = true;
                    ocultarPantallaCarga(); 
                    console.log("[Final] ¡La fila de audios se vació por completo! Todo a salvo en el servidor.");
                    
                    if (typeof finishExperiment === 'function') {
                        finishExperiment(); 
                    }
                });
            },
        };

        jsPsych.run([
            bienvenida,
            pantalla,
            calibracion,
            instrucciones_2,
            autobiografica_1,
            autobiografica_2,
            autobiografica_3,
            pregunta_edad,
            nodo_adultez_media,
            autobiografica_5, 
            pantalla_final
        ]);
    </script>
</body>

</html>
